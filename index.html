<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#d7f1ff" />
    <title>Bus Fever Party!</title>
  </head>
  <body>
    <div id="app">
      <main id="stage" class="stage">
        <canvas id="game-canvas" aria-label="Bus Fever Party!"></canvas>
        <div id="progress-hud" class="progress-hud" hidden></div>
        <div id="iq-hud" hidden><img alt="" draggable="false"><span id="iq-score"></span></div>
        <div id="bus-combo" aria-hidden="true" hidden>
          <span class="combo-meter"><img alt="" draggable="false"><span class="combo-track"><img alt="" draggable="false"><span class="combo-fill"><img alt="" draggable="false"></span></span></span>
          <span class="combo-label"></span>
        </div>
        <div id="countdown" class="countdown" role="timer" aria-live="off" hidden>
          <img id="countdown-image" alt="" aria-hidden="true" draggable="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
          <span id="countdown-value" class="countdown-value">00:30</span>
          <img id="countdown-alarm-icon" class="countdown-alarm-icon" alt="" aria-hidden="true" draggable="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" hidden />
        </div>
        <div id="countdown-warning" class="countdown-warning" aria-hidden="true" hidden></div>
        <canvas id="super-boost-flames" class="super-boost-flames" aria-hidden="true" hidden></canvas>
        <div id="super-boost-guide" class="super-boost-guide" hidden>
          <div class="super-boost-guide-copy" id="super-boost-guide-copy">TAP TO BOOST!</div>
          <img id="super-boost-guide-hand" alt="" aria-hidden="true" draggable="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
        </div>
        <div id="stamina" class="stamina" role="img" hidden>
          <img id="stamina-frame" class="stamina-frame" alt="" draggable="false" />
          <div id="stamina-hearts" class="stamina-hearts" aria-hidden="true"></div>
        </div>
        <div id="stamina-intro" class="stamina-intro" role="img" hidden>
          <div class="stamina-intro-card">
            <img id="stamina-intro-frame" class="stamina-intro-art" alt="" draggable="false" />
          </div>
        </div>
        <div id="pre-roll-overlay" class="pre-roll-overlay" aria-hidden="false">
          <video id="pre-roll-video" class="pre-roll-video" preload="auto" autoplay muted playsinline webkit-playsinline></video>
        </div>
        <div id="branding-overlay" class="branding-overlay" aria-label="Icon, logo, and text overlay">
          <img id="branding-icon" class="branding-item" src="/assets/icon-android.jpg" alt="Bus Fever Party! icon" draggable="false" />
          <span id="branding-icon-frame" class="branding-item branding-frame" aria-hidden="true" hidden></span>
          <img id="branding-logo" class="branding-item" src="/assets/main-loading-icon-small.png" alt="Bus Fever Party! logo" draggable="false" />
          <span id="branding-logo-frame" class="branding-item branding-frame" aria-hidden="true" hidden></span>
          <div id="branding-text" class="branding-item branding-text">Bus Fever Party!</div>
        </div>
        <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
          <img id="loading-icon" alt="Bus Fever Party! icon" />
          <h1 id="loading-title">Bus Fever Party!</h1>
          <div class="loading-progress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="loading-progress-bar" class="loading-progress-bar"></div>
          </div>
          <p id="loading-progress-value" class="loading-progress-value">0%</p>
        </div>
        <div id="end-panel" class="end-panel" hidden>
          <p id="end-kicker">LEVEL COMPLETE</p><h2 id="end-title">全部车辆已发车</h2>
          <button id="end-reset-button" type="button">再玩一次</button>
        </div>
        <div id="game-over-overlay" class="game-over-overlay" hidden>
          <div id="game-over-title" class="game-over-title">Game Over</div>
          <img id="game-over-logo" class="game-over-logo" alt="Bus Fever Party! logo" />
          <p id="game-over-prompt" class="game-over-prompt" hidden>Wanna try again?</p>
        </div>
        <button id="game-over-retry" class="game-over-retry" type="button" aria-label="Retry" hidden>Retry</button>
        <div id="stage-choice-overlay" class="stage-choice-overlay" hidden>
          <h2 id="stage-choice-title" class="stage-choice-title">Please Choose a Stage</h2>
          <div id="stage-choice-grid" class="stage-choice-grid" role="group" aria-label="Choose a stage"></div>
          <img id="stage-choice-hand" class="stage-choice-hand" src="/assets/applovin/main-guide-hand_q80.webp" alt="" aria-hidden="true" draggable="false" />
        </div>
        <button id="cta-button" class="cta-button" type="button" aria-label="Play Now" hidden>Play Now</button>
        <button id="speed-toggle" class="speed-toggle" type="button" aria-label="Playback speed" aria-pressed="false" hidden>
          <!-- Transparent seed like #countdown-image: the switch is off in most
               deliveries, so its art is inlined only when the tuning enables it
               and the real src is assigned from `resolveSpeedToggleIcon` at
               runtime. A root-relative URL here would force the packager to
               inline an image this element can never show. -->
          <img id="speed-toggle-icon" class="speed-toggle-icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" draggable="false" />
          <span id="speed-toggle-label" class="speed-toggle-label">x1</span>
        </button>
      </main>
      <aside id="scene-editor" class="scene-editor" aria-label="Scene editor"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
