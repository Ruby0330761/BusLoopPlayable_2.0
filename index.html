<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#d7f1ff" />
    <title>Bus Fever - Car Jam Escape</title>
  </head>
  <body>
    <div id="app">
      <main id="stage" class="stage">
        <canvas id="game-canvas" aria-label="Bus Fever - Car Jam Escape"></canvas>
        <div id="branding-overlay" class="branding-overlay" aria-label="Icon, logo, and text overlay">
          <img id="branding-icon" class="branding-item" alt="Bus Fever icon" draggable="false" />
          <img id="branding-logo" class="branding-item" src="/assets/main-loading-icon-small.png" alt="Bus Fever logo" draggable="false" />
          <div id="branding-text" class="branding-item branding-text">Bus Fever-Car Jam Escape</div>
          <div id="passenger-emoji" class="branding-item passenger-emoji" aria-label="Angry passenger emoji"></div>
          <div id="guide-hand-hint" class="guide-hand-hint" hidden aria-hidden="true">
            <img class="guide-hand-hint__hand" src="/assets/applovin/main-guide-hand_q80.webp" alt="" draggable="false" />
            <div class="guide-hand-hint__label">HOLD TO SPEED UP</div>
          </div>
        </div>
        <div id="firetruck-hud" class="firetruck-hud" hidden>
          <div class="firetruck-screen-effect" aria-hidden="true">
            <img class="firetruck-screen-effect__warning firetruck-screen-effect__warning--primary" alt="" />
            <img class="firetruck-screen-effect__warning firetruck-screen-effect__warning--strong" alt="" />
            <div class="firetruck-screen-effect__flames">
              <i class="firetruck-screen-effect__flame firetruck-screen-effect__flame--top-left"></i>
              <i class="firetruck-screen-effect__flame firetruck-screen-effect__flame--top-right"></i>
              <i class="firetruck-screen-effect__flame firetruck-screen-effect__flame--bottom-left"></i>
              <i class="firetruck-screen-effect__flame firetruck-screen-effect__flame--bottom-right"></i>
            </div>
          </div>
          <div class="firetruck-timer" role="timer" aria-live="polite" aria-label="Fire truck countdown">
            <img class="firetruck-timer__frame" alt="" aria-hidden="true" />
            <img class="firetruck-timer__vehicle" alt="" aria-hidden="true" />
            <div class="firetruck-timer__readout">
              <img class="firetruck-timer__readout-bg" alt="" aria-hidden="true" />
              <img class="firetruck-timer__clock" alt="" aria-hidden="true" />
              <div id="firetruck-countdown" class="firetruck-timer__countdown">0s</div>
            </div>
          </div>
        </div>
        <div id="foreground-video-overlay" class="foreground-video-overlay" hidden>
          <canvas id="foreground-video-backdrop" class="foreground-video-backdrop" aria-hidden="true"></canvas>
          <video
            id="foreground-video"
            class="foreground-video"
            muted
            playsinline
            webkit-playsinline
            preload="auto"
            aria-label="Foreground intro animation"
          ></video>
        </div>
        <video
          id="foreground-transition-video"
          class="foreground-transition-video"
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          aria-label="Foreground transition effect"
          hidden
        ></video>
        <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
          <img src="/assets/applovin/icon_q75.jpg" alt="Bus Fever - Car Jam Escape icon" />
          <h1>Bus Fever - Car Jam Escape</h1>
          <div class="loading-progress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="loading-progress-bar" class="loading-progress-bar"></div>
          </div>
          <p id="loading-progress-value" class="loading-progress-value">0%</p>
        </div>
        <div id="end-panel" class="end-panel" hidden>
          <p id="end-kicker">LEVEL COMPLETE</p><h2 id="end-title">全部车辆已发车</h2>
          <button id="end-reset-button" type="button">再玩一次</button>
        </div>
        <div id="game-over-overlay" class="game-over-overlay" hidden>
          <div id="game-over-title" class="game-over-title">Game Over</div>
          <img id="game-over-logo" class="game-over-logo" alt="Bus Fever logo" />
          <button id="cta-button" class="cta-button" type="button" aria-label="Play Now" hidden>Play Now</button>
          <button id="game-over-retry-button" class="cta-button game-over-retry-button" type="button" aria-label="Retry" hidden>Retry</button>
        </div>
        <button id="retry-button" class="retry-button" type="button" aria-label="Retry level" title="Retry level">↻</button>
        <div id="retry-transition" class="retry-transition" hidden aria-hidden="true"></div>
      </main>
      <aside id="scene-editor" class="scene-editor" aria-label="Scene editor"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
