function hud(n,left=n){const g=geo(n),el=document.createElement('div');el.className='hud';el.dataset.total=n;el.setAttribute('role','img');el.setAttribute('aria-label',`${n} 颗体力，剩余 ${left} 颗`);Object.assign(el.style,{width:g.w+'px',height:g.h+'px'});el.style.setProperty('--frame',`url("${A.frame}")`);el.style.setProperty('--by','32.142857%');el.style.setProperty('--bx',(g.h/2/g.w*100)+'%');el.style.setProperty('--size',g.size+'px');el.style.setProperty('--gap',g.gap+'px');let i=0;const rows=document.createElement('div');rows.className='rows';for(const count of g.rows){const row=document.createElement('div');row.className='row';for(let c=0;c<count;c++){const img=new Image();img.src=i++<left?A.heart:A.empty;img.alt='';row.append(img)}rows.append(row)}el.append(rows);return el}
function paint(){document.querySelector('#stage').replaceChildren(hud(total,remaining));document.querySelector('#status').textContent=`剩余 ${remaining} / ${total}`;document.querySelector('#consume').disabled=remaining===0}
for(let i=0;i<5;i++)for(const n of [i+1,i+6]){const sample=document.createElement('div');sample.className='sample';const label=document.createElement('div'),g=geo(n);label.innerHTML=`<strong>${n} 颗</strong><small>${g.rows.join(' + ')}</small>`;sample.append(label,hud(n));document.querySelector('#grid').append(sample)}
for(const id of ['count','number'])document.getElementById(id).addEventListener('input',e=>{if(!e.target.value||!e.target.validity.valid)return;total=Number(e.target.value);remaining=total;document.querySelector('#count').value=total;document.querySelector('#number').value=total;paint()});document.querySelector('#consume').onclick=()=>{remaining=Math.max(0,remaining-1);paint()};document.querySelector('#reset').onclick=()=>{remaining=total;paint()};paint();
